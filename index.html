    <style>
        :root {
            --bg-color: #050505; 
            --card-bg: #121212; 
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --positive: #10b981;
            --negative: #ef4444;
            --border-color: #262626;
            --base-font-size: 15px;
            --logo-yellow: #fbbf24;
            --sidebar-width: 260px;
            --color-aktie: #3b82f6;
            --color-etf: #8b5cf6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- SIDEBAR & OVERLAY --- */
        .sidebar {
            position: fixed; top: 0; left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width); height: 100%;
            background: var(--card-bg); border-right: 1px solid var(--border-color);
            z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 16px;
        }
        .sidebar.open { transform: translateX(var(--sidebar-width)); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            z-index: 999; display: none;
        }
        .overlay.active { display: block; }

        .sidebar-nav-container {
            position: relative;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-indicator {
            position: absolute;
            left: 4px;
            width: calc(100% - 8px);
            height: 48px;
            background: #262626;
            border-radius: 10px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            transform: translateY(0);
        }

        .menu-item {
            position: relative;
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dim);
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
            background: transparent;
            border: none;
            width: 100%;
            font-family: inherit;
            font-size: 15px;
        }
        .menu-item.active { color: var(--text-main); }

        /* --- HEADER --- */
        .app-shell { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
        header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 24px; }
        
        .nav-trigger { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 0; display: flex; align-items: center; }
        .title-area { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo-svg { width: 38px; height: 38px; image-rendering: pixelated; }
        
        #money-hand { transform-origin: 22px 17px; animation: money-wave 2.5s ease-in-out infinite; }
        @keyframes money-wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

        h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            font-weight: 400; 
            font-family: 'VT323', monospace; 
            letter-spacing: 0px; 
            display: flex; 
            align-items: center;
        }
        h1 .title-dagobert { color: var(--negative); text-transform: none; }
        h1 .title-version { color: var(--logo-yellow); }
        h1 .bracket { color: var(--text-dim); font-weight: 400; opacity: 0.6; }
        h1::after { content: '_'; animation: blink 1s step-end infinite; color: var(--positive); margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            color: var(--text-main); border: 1px solid var(--border-color); 
            width: 44px; height: 44px; border-radius: 14px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
        }
        .refresh-btn:active { transform: scale(0.92); }
        .refresh-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; }
        .refresh-btn.spinning svg { animation: spin-color 1.2s linear infinite; }

        @keyframes spin-color {
            0% { transform: rotate(0deg); stroke: #3b82f6; }
            50% { stroke: #fbbf24; }
            100% { transform: rotate(360deg); stroke: #3b82f6; }
        }

        /* --- SHARED UI --- */
        .filter-bar { display: flex; position: relative; background: var(--card-bg); padding: 4px; border-radius: 14px; margin-bottom: 24px; border: 1px solid var(--border-color); overflow: hidden; }
        .nav-indicator { position: absolute; height: calc(100% - 8px); top: 4px; left: 0; background: #262626; border-radius: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
        .filter-btn { position: relative; flex: 1; min-width: 80px; background: transparent; color: var(--text-dim); border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-size: var(--base-font-size); font-weight: 600; z-index: 2; text-align: center; }
        .filter-btn.active { color: var(--text-main); }

        .total-box { background: var(--card-bg); padding: 32px 24px; border-radius: 24px; text-align: center; margin-bottom: 24px; border: 1px solid var(--border-color); }
        .total-label { font-size: var(--base-font-size); font-weight: 600; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .total-value { font-size: 2.8rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .total-change { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; }
        .total-change.positive { color: var(--positive); }
        .total-change.negative { color: var(--negative); }

        .last-update { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--text-dim); opacity: 0.6; }
        
        /* --- STATUS DOT --- */
        .pulse-dot { width: 8px; height: 8px; background-color: var(--positive); border-radius: 50%; animation: pulse-green 2s infinite; transition: background-color 0.3s ease; }
        .pulse-dot.stale { background-color: var(--logo-yellow); animation: pulse-yellow 2s infinite; }
        .pulse-dot.loading { background-color: var(--negative); animation: pulse-red 0.4s infinite alternate; }

        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes pulse-yellow { 0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); } }
        @keyframes pulse-red { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.5; transform: scale(1.3); box-shadow: 0 0 8px var(--negative); } }

        /* --- ANALYSE SPECIFIC --- */
        .analyse-card { background: var(--card-bg); padding: 24px; border-radius: 24px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        .analyse-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: var(--text-main); text-align: left; }
        
        .chart-container { display: flex; align-items: center; gap: 30px; }
        
        /* SVG Pie Chart Fix */
        .pie-wrapper { width: 120px; height: 120px; flex-shrink: 0; position: relative; }
        .pie-wrapper svg { transform: rotate(-90deg); border-radius: 50%; width: 100%; height: 100%; }
        .pie-bg { fill: none; stroke: var(--color-etf); stroke-width: 32; }
        .pie-segment { fill: none; stroke: var(--color-aktie); stroke-width: 32; stroke-dasharray: 0 100; transition: stroke-dasharray 0.5s ease; }

        .legend { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .legend-item { display: flex; align-items: flex-start; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
        .flag-box { font-size: 20px; line-height: 1; margin-top: 2px; min-width: 24px; }
        .legend-info { display: flex; flex-direction: column; }
        .legend-name { font-size: 14px; font-weight: 600; color: var(--text-dim); }
        .legend-value { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .legend-perc { font-size: 12px; color: var(--text-dim); }

        #country-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 12px;
        }

        /* --- PAGES --- */
        #page-portfolio, #page-analyse, #page-dividenden { display: none; }
        .page-active { display: block !important; }

        /* --- SORT SPECIFIC --- */
        .sort-row { display: flex; gap: 8px; margin-bottom: 24px; }
        .sort-bar-container { flex: 1; margin-bottom: 0; }

        .asset-card { background: var(--card-bg); padding: 16px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .asset-name { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .asset-meta { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .asset-amount { font-size: 12.5px; color: var(--text-dim); }
        .value-eur { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
        .flag-circle { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: #1a1a1a; }

        .text-green { color: var(--positive); }
        .text-red { color: var(--negative); }

        footer { 
            padding: 40px 40px 10px 40px; text-align: center; font-size: 12px; 
            color: var(--text-dim); opacity: 0.5; display: flex; 
            justify-content: center; align-items: center; letter-spacing: 1px; 
        }
        .footer-content { display: inline-flex; align-items: center; justify-content: center; perspective: 500px; }
        .letter { display: inline-flex; align-items: center; justify-content: center; animation: letter-rotate 4s infinite; transform-style: preserve-3d; }
        
        /* Pixel Heart Styling */
        .pixel-heart { 
            width: 14px; 
            height: 14px; 
            margin: 0 8px; 
            display: inline-block; 
            vertical-align: middle; 
            position: relative; 
            top: -1px;
        }
        .pixel-heart svg { width: 100%; height: 100%; fill: var(--negative); image-rendering: pixelated; }

        @keyframes letter-rotate { 0%, 80% { transform: rotateY(0deg); } 90% { transform: rotateY(360deg); } 100% { transform: rotateY(360deg); } }

        @keyframes glow-sheen {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .footer-version {
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            opacity: 0.3;
            padding-bottom: 40px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLJWMGwbMH9JkTW2S0ZI6tnhjxokOKjylOzuGdI2KvQEJ2FB3VsDowH3bJzPSF54bbAZhZagyda1Xk/pub?gid=0&single=true&output=csv';
    const PROXIES = ['https://api.allorigins.win/raw?url=', 'https://api.codetabs.com/v1/proxy?quest='];
    const countryToFlag = {'DE': '🇩🇪', 'US': '🇺🇸', 'GB': '🇬🇧', 'FR': '🇫🇷', 'NL': '🇳🇱', 'IE': '🇮🇪', 'LU': '🇱🇺', 'CH': '🇨🇭', 'JP': '🇯🇵', 'CN': '🇨🇳', 'KR': '🇰🇷', 'IN': '🇮🇳', 'BR': '🇧🇷', 'CA': '🇨🇦', 'AU': '🇦🇺', 'SG': '🇸🇬', 'HK': '🇭🇰', 'SE': '🇸🇪', 'NO': '🇳🇴', 'DK': '🇩🇰', 'FI': '🇫🇮', 'AT': '🇦Ť', 'BE': '🇧🇪', 'ES': '🇪🇸', 'IT': '🇮🇹', 'PT': '🇵🇹', 'GR': '🇬🇷', 'PL': '🇵🇱', 'CZ': '🇨🇿', 'HU': '🇭🇺', 'TW': '🇹🇼', 'MX': '🇲🇽', 'ZA': '🇿🇦', 'SA': '🇸🇦', 'AE': '🇦ZW', 'IL': '🇮🇱'};

    const eurFormatter = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });

    let allData = [], currentFilter = 'alle', currentSort = 'name', sortAsc = true;
    let lastFetchTime = null;
    let totalDividendsSold = 0; 

    const pixelHeartSvg = `<span class="pixel-heart"><svg viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="1" width="3" height="1"/><rect x="7" y="1" width="3" height="1"/><rect x="1" y="2" width="5" height="1"/><rect x="6" y="2" width="5" height="1"/><rect x="0" y="3" width="12" height="1"/><rect x="0" y="4" width="12" height="1"/><rect x="0" y="5" width="12" height="1"/><rect x="1" y="6" width="10" height="1"/><rect x="2" y="7" width="8" height="1"/><rect x="3" y="8" width="6" height="1"/><rect x="4" y="9" width="4" height="1"/><rect x="5" y="10" width="2" height="1"/></svg></span>`;

    function setupFooterAnimation() {
        const footer = document.getElementById('animated-footer');
        const parts = ["M", "A", "D", "E", " ", "W", "I", "T", "H", " ", "❤️", " ", "B", "Y", " ", "C", "M"];
        footer.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'footer-content';
        parts.forEach((char, i) => {
            const span = document.createElement('span');
            span.style.animationDelay = `${i * 0.1}s`;
            if (char === "❤️") { span.className = 'letter'; span.innerHTML = pixelHeartSvg; } 
            else if (char === ' ') { span.className = 'letter'; span.innerHTML = '&nbsp;'; } 
            else { span.className = 'letter'; span.innerText = char; }
            wrap.appendChild(span);
        });
        footer.appendChild(wrap);
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }

    function showPage(pageId, index) {
        document.getElementById('page-portfolio').classList.remove('page-active');
        document.getElementById('page-analyse').classList.remove('page-active');
        document.getElementById('page-dividenden').classList.remove('page-active');
        document.getElementById('page-' + pageId).classList.add('page-active');
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => item.classList.remove('active'));
        menuItems[index].classList.add('active');
        const indicator = document.getElementById('sidebar-indicator');
        indicator.style.transform = `translateY(${index * 52}px)`;
        toggleMenu();
        const activeFilterBtn = document.querySelector('#filter-inner .filter-btn.active');
        if(activeFilterBtn) moveIndicator(activeFilterBtn);
        render(); 

        const activeSortBtn = document.querySelector(`#page-${pageId} .sort-bar-container .filter-btn.active`);
        if (activeSortBtn) moveSortIndicator(activeSortBtn);
    }

    function setSort(type, btn) {
        if (currentSort === type) {
            sortAsc = !sortAsc;
        } else {
            currentSort = type;
            sortAsc = (type === 'name'); 
            if (type !== 'name') sortAsc = false;
        }

        document.querySelectorAll('.sort-bar-container .filter-btn').forEach(b => {
            b.classList.remove('active');
            if (b.getAttribute('onclick').includes("'name'")) b.innerText = 'Name';
            if (b.getAttribute('onclick').includes("'value'")) b.innerText = 'Kurswert';
            if (b.getAttribute('onclick').includes("'gain'")) b.innerText = 'Performance';
            if (b.getAttribute('onclick').includes("'divGesamt'")) b.innerText = 'Gesamt';
            if (b.getAttribute('onclick').includes("'div2026'")) b.innerText = 'aktuelles Jahr';
        });

        btn.classList.add('active');
        btn.innerText += sortAsc ? ' ▴' : ' ▾';
        
        moveSortIndicator(btn);
        render();
    }

    function moveSortIndicator(btn) {
        const container = btn.closest('.sort-bar-container');
        const indicator = container.querySelector('.nav-indicator');
        if(indicator && btn) { indicator.style.width = btn.offsetWidth + 'px'; indicator.style.left = btn.offsetLeft + 'px'; }
    }

    async function handleRefresh() {
        const btn = document.getElementById('refresh-btn');
        const dot = document.getElementById('status-dot');
        const body = document.getElementById('app-body');
        if(btn.classList.contains('spinning')) return;
        
        btn.classList.add('spinning');
        dot.className = 'pulse-dot loading';
        body.classList.add('is-loading');
        
        const fetchPromise = loadData();
        const minDelayPromise = new Promise(resolve => setTimeout(resolve, 400));
        await Promise.all([fetchPromise, minDelayPromise]);
        
        btn.classList.remove('spinning'); 
        body.classList.remove('is-loading'); 
        checkDataFreshness();
    }

    async function tryFetch(url) {
        const controller = new AbortController();
        try {
            const result = await Promise.any(PROXIES.map(async proxy => {
                const res = await fetch(proxy + encodeURIComponent(url), { signal: controller.signal });
                if (!res.ok) throw new Error('HTTP error');
                const text = await res.text();
                if (text.length < 50) throw new Error('Data too short');
                return text;
            }));
            controller.abort(); 
            return result;
        } catch (e) {
            return "";
        }
    }

    async function loadData() {
        const csv = await tryFetch(SHEET_URL);
        if(!csv) return;
        const rows = parseCSV(csv);
        const head = rows[0].map(x => x.toLowerCase().trim());
        const m = {
            n: head.findIndex(x => x.includes('wertpapier')),
            i: head.findIndex(x => x.includes('isin')),
            d: head.findIndex(x => x.includes('depot')),
            s: head.findIndex(x => x.includes('stück')),
            ew: head.findIndex(x => x.includes('einstandswert')),
            kw: head.findIndex(x => x.includes('kurswert')),
            kat: head.findIndex(x => x.includes('kategorie')),
            div26: 10, 
            divGes: head.findIndex(x => x.includes('erhaltene dividende gesamt'))
        };

        allData = [];
        totalDividendsSold = 0;
        const depots = new Set();
        
        for (let i = 1; i < rows.length; i++) {
            const r = rows[i]; if (!r[m.n]) continue;
            const nameLower = r[m.n].toLowerCase();
            
            if (nameLower.includes('bereits verkaufte wertpapiere')) {
                totalDividendsSold = parseMenge(r[m.divGes]); 
                continue;
            }

            const item = { 
                name: r[m.n], 
                isin: r[m.i], 
                depot: r[m.d] || '?', 
                stück: parseMenge(r[m.s]), 
                kurswert: parseMenge(r[m.kw]), 
                einstand: parseMenge(r[m.ew]), 
                kategorie: r[m.kat] || 'Aktie',
                div2026: parseMenge(r[m.div26]),
                divGesamt: parseMenge(r[m.divGes])
            };
            item.diff = item.kurswert - item.einstand;
            item.diffP = item.einstand ? (item.diff / item.einstand) * 100 : 0;
            
            allData.push(item); 
            depots.add(item.depot);
        }
        
        const now = new Date();
        lastFetchTime = now;
        const timeString = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('update-time').innerText = `Aktualisiert: ${now.toLocaleDateString('de-DE')} • ${timeString} Uhr`;
        
        updateFilters(depots);
        
        const activeSortBtns = document.querySelectorAll('.sort-bar-container .filter-btn.active');
        activeSortBtns.forEach(btn => {
            btn.innerText = btn.innerText.split(' ')[0] + (sortAsc ? ' ▴' : ' ▾');
        });

        render();
        checkDataFreshness();

        setTimeout(() => {
            activeSortBtns.forEach(btn => moveSortIndicator(btn));
        }, 100);
    }

    function checkDataFreshness() {
        if (!lastFetchTime) return;
        const dot = document.getElementById('status-dot');
        const diffMinutes = (new Date() - lastFetchTime) / 1000 / 60;
        if (diffMinutes >= 5) { dot.className = 'pulse-dot stale'; } 
        else { dot.className = 'pulse-dot'; }
    }
    setInterval(checkDataFreshness, 30000);

    function updateFilters(set) {
        const container = document.getElementById('filter-inner');
        const list = ['alle', ...Array.from(set).sort()];
        container.innerHTML = list.map(d => `<button class="filter-btn ${d === currentFilter ? 'active' : ''}" onclick="setFilter(this, '${d}')">${d}</button>`).join('');
        const activeBtn = Array.from(container.querySelectorAll('#filter-inner .filter-btn')).find(b => b.innerText === currentFilter);
        if(activeBtn) moveIndicator(activeBtn);
    }

    function setFilter(btn, value) {
        currentFilter = value;
        document.querySelectorAll('#filter-inner .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        moveIndicator(btn);
        render();
    }

    function moveIndicator(btn) {
        const indicator = document.getElementById('nav-indicator');
        if (indicator && btn) { indicator.style.width = btn.offsetWidth + 'px'; indicator.style.left = btn.offsetLeft + 'px'; }
    }

    function render() {
        let filtered = currentFilter === 'alle' ? allData : allData.filter(d => d.depot === currentFilter);
        
        let sortedData = [...filtered];
        sortedData.sort((a, b) => {
            let res = 0;
            if (currentSort === 'name') res = a.name.localeCompare(b.name);
            else if (currentSort === 'value') res = a.kurswert - b.kurswert;
            else if (currentSort === 'gain') res = a.diffP - b.diffP;
            else if (currentSort === 'divGesamt') res = a.divGesamt - b.divGesamt;
            else if (currentSort === 'div2026') res = a.div2026 - b.div2026;
            return sortAsc ? res : -res;
        });

        let tW = 0, tE = 0, sumDivGesamt = 0, sumDiv2026 = 0, html = '', divHtml = '', etfSum = 0, aktieSum = 0;
        let countries = {};

        if (currentFilter === 'alle') { sumDivGesamt += totalDividendsSold; }

        sortedData.forEach(item => {
            tW += item.kurswert; tE += item.einstand;
            sumDivGesamt += item.divGesamt;
            sumDiv2026 += item.div2026;

            if(item.kategorie.toLowerCase().includes('etf')) { etfSum += item.kurswert; } 
            else { 
                aktieSum += item.kurswert;
                const cCode = item.isin?.substring(0, 2).toUpperCase() || '🌍';
                countries[cCode] = (countries[cCode] || 0) + item.kurswert;
            }
            const isP = item.diff >= 0;
            
            html += `
                <div class="asset-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div class="asset-name">${item.name}</div>
                            <div class="asset-meta">
                                <span>${item.isin}</span>
                                <div class="flag-circle">${getFlag(item.isin, item.kategorie)}</div>
                            </div>
                            <div class="asset-amount">
                                ${formatStueck(item.stück)} Stk. &middot; Kaufwert ${fC(item.einstand)}
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div class="value-eur">${fC(item.kurswert)}</div>
                            <div style="font-size:0.85rem; font-weight:600; margin-top: 4px;" class="${isP?'text-green':'text-red'}">
                                ${isP?'+':''}${fC(item.diff)}
                            </div>
                            <div style="font-size:0.85rem; font-weight:600" class="${isP?'text-green':'text-red'}">
                                ${isP?'+':''}${item.diffP.toFixed(2)}%
                            </div>
                        </div>
                    </div>
                </div>`;

            const div2026Color = item.div2026 === 0 ? 'var(--text-dim)' : 'var(--positive)';

            divHtml += `
                <div class="asset-card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <div class="asset-name">${item.name}</div>
                            <div class="asset-meta">
                                <span>${item.isin}</span>
                                <div class="flag-circle">${getFlag(item.isin, item.kategorie)}</div>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">Gesamtdividende</div>
                            <div class="value-eur" style="font-size: 1.1rem;">${fC(item.divGesamt)}</div>
                            <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px;">davon in 2026</div>
                            <div style="font-size: 1rem; font-weight: 700; color: ${div2026Color};">${fC(item.div2026)}</div>
                        </div>
                    </div>
                </div>`;
        });

        const isDivPage = document.getElementById('page-dividenden').classList.contains('page-active');
        const updateContainer = document.getElementById('last-update-container');
        const mainChange = document.getElementById('main-change');

        if (isDivPage) {
            document.getElementById('total-label').innerText = "GESAMTDIVIDENDE";
            document.getElementById('main-value').innerText = fC(sumDivGesamt);
            mainChange.className = 'total-change'; 
            mainChange.style.marginTop = "24px";
            
            if (currentFilter === 'alle') {
                const ziel = 15000;
                const prozent = Math.max(0, (sumDiv2026 / ziel) * 100);
                const balkenBreite = Math.min(100, prozent);
                const hue = Math.min(120, prozent * 1.2); 
                const dynamicColor = `hsl(${hue}, 80%, 45%)`;
                
                mainChange.innerHTML = `
                    <div class="total-label" style="margin-bottom: 4px;">DAVON IN 2026</div>
                    <div style="color: ${dynamicColor}; font-size: 1.6rem; font-weight: 700; transition: color 0.5s ease;">${fC(sumDiv2026)}</div>
                    
                    <div style="display: flex; align-items: center; justify-content: center; margin-top: 14px;">
                        <div style="flex: 1; max-width: 250px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 8px; height: 10px; overflow: hidden;">
                            <div style="width: ${balkenBreite}%; background-color: ${dynamicColor}; background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%); background-size: 200% 100%; height: 100%; border-radius: 8px; transition: width 1s ease, background-color 0.5s ease; animation: glow-sheen 2s linear infinite;"></div>
                        </div>
                    </div>

                    <div style="font-size: 11px; color: var(--text-dim); margin-top: 10px; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <span>JAHRESZIEL: 15.000 €</span>
                        <span style="font-size: 14px;">&middot;</span>
                        <span style="color: ${dynamicColor}; transition: color 0.5s ease;">${prozent.toFixed(1)}%</span>
                    </div>
                `;
            } else {
                mainChange.innerHTML = `
                    <div class="total-label" style="margin-bottom: 4px;">DAVON IN 2026</div>
                    <div style="color: var(--positive); font-size: 1.6rem; font-weight: 700;">${fC(sumDiv2026)}</div>
                `;
            }
            updateContainer.style.display = 'none';
        } else {
            document.getElementById('total-label').innerText = (currentFilter === 'alle') ? 'Gesamtwert' : `Depot ${currentFilter}`;
            document.getElementById('main-value').innerText = fC(tW);
            const diff = tW - tE, perc = tE ? (diff / tE) * 100 : 0;
            mainChange.style.marginTop = "";
            mainChange.className = `total-change ${diff >= 0 ? 'positive' : 'negative'}`;
            mainChange.innerText = `${diff >= 0 ? '+' : ''}${fC(diff)} (${perc.toFixed(2)}%)`;
            updateContainer.style.display = 'flex';
        }

        document.getElementById('list').innerHTML = html;
        document.getElementById('div-list').innerHTML = divHtml;

        renderAnalyse(aktieSum, etfSum, tW, countries);
        
        if (window.twemoji) {
            const emojiConfig = { folder: 'svg', ext: '.svg' };
            twemoji.parse(document.getElementById('list'), emojiConfig);
            twemoji.parse(document.getElementById('div-list'), emojiConfig);
            twemoji.parse(document.getElementById('country-legend'), emojiConfig);
        }
    }

    function renderAnalyse(aktien, etfs, gesamt, countries) {
        const pAktie = gesamt ? (aktien / gesamt * 100) : 0;
        const pEtf = gesamt ? (etfs / gesamt * 100) : 0;
        const segment = document.getElementById('pie-segment-aktie');
        segment.style.strokeDasharray = `${pAktie} 100`;
        document.getElementById('allocation-legend').innerHTML = `
            <div class="legend-item"><div class="dot" style="background: var(--color-aktie)"></div><div class="legend-info"><span class="legend-name">Aktien</span><span class="legend-value">${fC(aktien)}</span><span class="legend-perc">${pAktie.toFixed(1)}%</span></div></div>
            <div class="legend-item"><div class="dot" style="background: var(--color-etf)"></div><div class="legend-info"><span class="legend-name">ETFs</span><span class="legend-value">${fC(etfs)}</span><span class="legend-perc">${pEtf.toFixed(1)}%</span></div></div>`;
        const sortedCountries = Object.entries(countries).sort((a, b) => b[1] - a[1]);
        document.getElementById('country-legend').innerHTML = sortedCountries.map(([code, val]) => {
            const p = gesamt ? (val / gesamt * 100) : 0;
            const formattedVal = fC(val).split(',')[0] + ' €'; 
            return `<div class="legend-item"><div class="flag-box">${countryToFlag[code] || '🌍'}</div><div class="legend-info"><span class="legend-name">${code}</span><span class="legend-value">${formattedVal}</span><span class="legend-perc">${p.toFixed(1)}%</span></div></div>`;
        }).join('');
    }

    function fC(v) { return eurFormatter.format(v); }
    function parseMenge(t) { return parseFloat((t||"").toString().replace(/[€$£\s.]/g, '').replace(',', '.')) || 0; }
    function getFlag(isin, kat) { return (kat||"").toLowerCase().includes('etf') ? '🌍' : (countryToFlag[isin?.substring(0, 2).toUpperCase()] || '🌍'); }
    function formatStueck(n) { return Number.isInteger(n) ? n.toString() : n.toFixed(2).replace('.', ','); }
    function parseCSV(t) {
        const rows = []; let cur = [], v = '', q = false;
        for (let i = 0, len = t.length; i < len; i++) {
            const c = t[i]; 
            if (c === '"') q = !q; 
            else if (c === ',' && !q) { cur.push(v.trim()); v = ''; } 
            else if ((c === '\n' || c === '\r') && !q) { 
                cur.push(v.trim()); rows.push(cur); cur = []; v = ''; 
                if(c==='\r'&&t[i+1]==='\n')i++; 
            } else v += c;
        }
        if (v || cur.length) { cur.push(v.trim()); rows.push(cur); }
        return rows;
    }
    setupFooterAnimation();
    handleRefresh();
</script>
</body>
