
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagobert v1.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>
    <style>
        :root {
            --bg-color: #050505; 
            --card-bg: #121212; 
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --positive: #10b981;
            --negative: #ef4444;
            --border-color: #262626;
            --base-font-size: 15px;
            --logo-yellow: #fbbf24;
            --sidebar-width: 260px;
            --color-aktie: #3b82f6;
            --color-etf: #8b5cf6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- SIDEBAR & OVERLAY --- */
        .sidebar {
            position: fixed; top: 0; left: calc(-1 * var(--sidebar-width));
            width: var(--sidebar-width); height: 100%;
            background: var(--card-bg); border-right: 1px solid var(--border-color);
            z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 16px;
        }
        .sidebar.open { transform: translateX(var(--sidebar-width)); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            z-index: 999; display: none;
        }
        .overlay.active { display: block; }

        .sidebar-nav-container {
            position: relative;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-indicator {
            position: absolute;
            left: 4px;
            width: calc(100% - 8px);
            height: 48px;
            background: #262626;
            border-radius: 10px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            transform: translateY(0);
        }

        .menu-item {
            position: relative;
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dim);
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
            background: transparent;
            border: none;
            width: 100%;
            font-family: inherit;
            font-size: 15px;
        }
        .menu-item.active { color: var(--text-main); }

        /* --- HEADER --- */
        .app-shell { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
        header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin-bottom: 24px; }
        
        .nav-trigger { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 0; display: flex; align-items: center; }
        .title-area { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logo-svg { width: 38px; height: 38px; image-rendering: pixelated; }
        
        #money-hand { transform-origin: 22px 17px; animation: money-wave 2.5s ease-in-out infinite; }
        @keyframes money-wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

        h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            font-weight: 400; 
            font-family: 'VT323', monospace; 
            color: var(--logo-yellow); 
            letter-spacing: 0px; 
            display: flex; 
            align-items: center;
            image-rendering: pixelated; 
        }
        h1 .bracket { color: var(--text-dim); font-weight: 400; opacity: 0.6; }
        h1::after { content: '_'; animation: blink 1s step-end infinite; color: var(--logo-yellow); margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            color: var(--text-main); border: 1px solid var(--border-color); 
            width: 44px; height: 44px; border-radius: 14px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
        }
        .refresh-btn:active { transform: scale(0.92); }
        .refresh-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; }
        .refresh-btn.spinning svg { animation: spin-color 1.2s linear infinite; }

        @keyframes spin-color {
            0% { transform: rotate(0deg); stroke: #3b82f6; }
            50% { stroke: #fbbf24; }
            100% { transform: rotate(360deg); stroke: #3b82f6; }
        }

        /* --- SHARED UI --- */
        .filter-bar { display: flex; position: relative; background: var(--card-bg); padding: 4px; border-radius: 14px; margin-bottom: 24px; border: 1px solid var(--border-color); overflow: hidden; }
        .nav-indicator { position: absolute; height: calc(100% - 8px); top: 4px; left: 0; background: #262626; border-radius: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
        .filter-btn { position: relative; flex: 1; min-width: 80px; background: transparent; color: var(--text-dim); border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-size: var(--base-font-size); font-weight: 600; z-index: 2; text-align: center; }
        .filter-btn.active { color: var(--text-main); }

        .total-box { background: var(--card-bg); padding: 32px 24px; border-radius: 24px; text-align: center; margin-bottom: 24px; border: 1px solid var(--border-color); }
        .total-label { font-size: var(--base-font-size); font-weight: 600; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .total-value { font-size: 2.8rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .total-change { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; }
        .total-change.positive { color: var(--positive); }
        .total-change.negative { color: var(--negative); }

        .last-update { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--text-dim); opacity: 0.6; }
        
        /* --- STATUS DOT --- */
        .pulse-dot { width: 8px; height: 8px; background-color: var(--positive); border-radius: 50%; animation: pulse-green 2s infinite; transition: background-color 0.3s ease; }
        .pulse-dot.loading { background-color: var(--negative); animation: pulse-red 0.4s infinite alternate; }

        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes pulse-red { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.5; transform: scale(1.3); box-shadow: 0 0 8px var(--negative); } }

        /* --- ANALYSE SPECIFIC --- */
        .analyse-card { background: var(--card-bg); padding: 24px; border-radius: 24px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        .analyse-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: var(--text-main); text-align: left; }
        
        .chart-container { display: flex; align-items: center; gap: 30px; }
        .pie-chart { 
            width: 120px; height: 120px; border-radius: 50%; 
            background: conic-gradient(var(--color-aktie) 0% 50%, var(--color-etf) 50% 100%); 
            flex-shrink: 0;
            box-shadow: inset 0 0 0 15px var(--card-bg);
        }
        
        .legend { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .legend-item { display: flex; align-items: flex-start; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
        .flag-box { font-size: 20px; line-height: 1; margin-top: 2px; min-width: 24px; }
        .legend-info { display: flex; flex-direction: column; }
        .legend-name { font-size: 14px; font-weight: 600; color: var(--text-dim); }
        .legend-value { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .legend-perc { font-size: 12px; color: var(--text-dim); }

        #country-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 12px;
        }

        /* --- PAGES --- */
        #page-portfolio, #page-analyse, #page-dividenden { display: none; }
        .page-active { display: block !important; }

        /* --- PORTFOLIO SPECIFIC --- */
        .sort-row { display: flex; gap: 8px; margin-bottom: 24px; }
        .sort-bar-container { flex: 1; margin-bottom: 0; }
        .dir-btn { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); width: 44px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; transition: all 0.2s ease; }
        .dir-btn:active { transform: scale(0.92); }

        .asset-card { background: var(--card-bg); padding: 16px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .asset-name { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .asset-meta { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .asset-amount { font-size: 13px; color: var(--text-dim); }
        .value-eur { font-size: 1.2rem; font-weight: 700; }
        .flag-circle { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: #1a1a1a; }

        .text-green { color: var(--positive); }
        .text-red { color: var(--negative); }

        footer { 
            padding: 40px; text-align: center; font-size: 12px; 
            color: var(--text-dim); opacity: 0.5; display: flex; 
            justify-content: center; align-items: center; letter-spacing: 1px; 
        }
        .footer-content { display: inline-flex; align-items: center; justify-content: center; perspective: 500px; }
        .letter { display: inline-flex; align-items: center; justify-content: center; animation: letter-rotate 4s infinite; transform-style: preserve-3d; }
        .letter img.emoji { height: 1.2em !important; width: 1.2em !important; margin: 0 3px !important; }
        @keyframes letter-rotate { 0%, 80% { transform: rotateY(0deg); } 90% { transform: rotateY(360deg); } 100% { transform: rotateY(360deg); } }
    </style>
</head>
<body id="app-body">

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav class="sidebar" id="sidebar">
    <div class="sidebar-nav-container">
        <div id="sidebar-indicator" class="sidebar-indicator"></div>
        <button class="menu-item active" onclick="showPage('portfolio', 0)">
            <span></span> Portfolio
        </button>
        <button class="menu-item" onclick="showPage('analyse', 1)">
            <span></span> Depotanalyse
        </button>
        <button class="menu-item" onclick="showPage('dividenden', 2)">
            <span></span> Dividenden
        </button>
    </div>
</nav>

<div class="app-shell">
    <header>
        <button class="nav-trigger" onclick="toggleMenu()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="title-area">
            <svg class="logo-svg" viewBox="0 0 32 32">
                <rect x="10" y="2" width="10" height="8" fill="#1e1e1e"/><rect x="10" y="7" width="10" height="1" fill="#ef4444"/><rect x="9" y="10" width="12" height="10" fill="#FFFFFF"/><rect x="12" y="14" width="2" height="2" fill="#000000"/><rect x="17" y="14" width="2" height="2" fill="#000000"/><rect x="8" y="17" width="14" height="3" fill="#fbbf24"/><g id="money-hand"><rect x="22" y="8" width="6" height="8" fill="#10b981"/><rect x="21" y="13" width="3" height="4" fill="#FFFFFF"/></g><rect x="9" y="20" width="12" height="8" fill="#ef4444"/><rect x="13" y="22" width="4" height="2" fill="#3b82f6"/>
            </svg>
            <h1><span class="bracket">&lt;&nbsp;</span>DAGOBERT v1.1<span class="bracket">&nbsp;/&gt;</span></h1>
        </div>
        <button id="refresh-btn" class="refresh-btn" onclick="handleRefresh()">
            <svg viewBox="0 0 24 24"><path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C14.8273 3 17.3387 4.3033 19 6.31579M19 6.31579V2M19 6.31579H14.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </header>

    <div class="filter-bar" id="filter-container">
        <div id="nav-indicator" class="nav-indicator"></div>
        <div id="filter-inner" style="display: flex; flex: 1; z-index: 2;"></div>
    </div>
    
    <div id="total" class="total-box">
        <div id="total-label" class="total-label">Gesamtwert</div>
        <div id="main-value" class="total-value">0,00 €</div>
        <div id="main-change" class="total-change">+0,00 € (+0,00%)</div>
        <div class="last-update">
            <div id="status-dot" class="pulse-dot"></div>
            <span id="update-time">Lade Daten...</span>
        </div>
    </div>

    <section id="page-portfolio" class="page-active">
        <div class="sort-row">
            <div class="filter-bar sort-bar-container">
                <div id="sort-indicator" class="nav-indicator"></div>
                <div style="display: flex; flex: 1; z-index: 2;">
                    <button class="filter-btn active" onclick="setSort('name', this)">Name</button>
                    <button class="filter-btn" onclick="setSort('value', this)">Kurswert</button>
                    <button class="filter-btn" onclick="setSort('gain', this)">Veränderung</button>
                </div>
            </div>
            <button id="sort-dir-btn" class="dir-btn" onclick="toggleSortDir()">↑</button>
        </div>
        <div id="list"></div>
    </section>

    <section id="page-analyse">
        <div class="analyse-card">
            <div class="analyse-title">Asset Allocation</div>
            <div class="chart-container">
                <div id="allocation-chart" class="pie-chart"></div>
                <div class="legend" id="allocation-legend"></div>
            </div>
        </div>

        <div class="analyse-card">
            <div class="analyse-title">Länderverteilung (Aktien)</div>
            <div id="country-legend"></div>
        </div>
    </section>

    <section id="page-dividenden">
    </section>

    <footer id="animated-footer">MADE WITH ❤️ BY CHRISTOPH</footer>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLJWMGwbMH9JkTW2S0ZI6tnhjxokOKjylOzuGdI2KvQEJ2FB3VsDowH3bJzPSF54bbAZhZagyda1Xk/pub?gid=0&single=true&output=csv';
    const PROXIES = ['https://api.allorigins.win/raw?url=', 'https://api.codetabs.com/v1/proxy?quest='];
    const countryToFlag = {'DE': '🇩🇪', 'US': '🇺🇸', 'GB': '🇬🇧', 'FR': '🇫🇷', 'NL': '🇳🇱', 'IE': '🇮🇪', 'LU': '🇱🇺', 'CH': '🇨🇭', 'JP': '🇯🇵', 'CN': '🇨🇳', 'KR': '🇰🇷', 'IN': '🇮🇳', 'BR': '🇧🇷', 'CA': '🇨🇦', 'AU': '🇦🇺', 'SG': '🇸🇬', 'HK': '🇭🇰', 'SE': '🇸🇪', 'NO': '🇳🇴', 'DK': '🇩🇰', 'FI': '🇫🇮', 'AT': '🇦Ť', 'BE': '🇧🇪', 'ES': '🇪🇸', 'IT': '🇮🇹', 'PT': '🇵🇹', 'GR': '🇬🇷', 'PL': '🇵🇱', 'CZ': '🇨🇿', 'HU': '🇭🇺', 'TW': '🇹🇼', 'MX': '🇲🇽', 'ZA': '🇿🇦', 'SA': '🇸🇦', 'AE': '🇦🇪', 'IL': '🇮🇱'};

    let allData = [], currentFilter = 'alle', currentSort = 'name', sortAsc = true;

    function setupFooterAnimation() {
        const footer = document.getElementById('animated-footer');
        const text = "MADE WITH ❤️ BY CHRISTOPH";
        footer.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'footer-content';
        [...text].forEach((char, i) => {
            const span = document.createElement('span');
            span.style.animationDelay = `${i * 0.1}s`;
            span.className = 'letter';
            if (char === ' ') span.innerHTML = '&nbsp;';
            else span.innerText = char;
            wrap.appendChild(span);
        });
        footer.appendChild(wrap);
        if (window.twemoji) twemoji.parse(footer, { folder: 'svg', ext: '.svg' });
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    }

    function showPage(pageId, index) {
        document.getElementById('page-portfolio').classList.remove('page-active');
        document.getElementById('page-analyse').classList.remove('page-active');
        document.getElementById('page-dividenden').classList.remove('page-active');
        document.getElementById('page-' + pageId).classList.add('page-active');
        
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => item.classList.remove('active'));
        menuItems[index].classList.add('active');
        
        const indicator = document.getElementById('sidebar-indicator');
        indicator.style.transform = `translateY(${index * 52}px)`;
        
        toggleMenu();
        const activeFilterBtn = document.querySelector('#filter-inner .filter-btn.active');
        if(activeFilterBtn) moveIndicator(activeFilterBtn);
    }

    function setSort(type, btn) {
        currentSort = type;
        document.querySelectorAll('.sort-bar-container .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        moveSortIndicator(btn);
        render();
    }

    function toggleSortDir() {
        sortAsc = !sortAsc;
        document.getElementById('sort-dir-btn').innerText = sortAsc ? '↑' : '↓';
        render();
    }

    function moveSortIndicator(btn) {
        const indicator = document.getElementById('sort-indicator');
        if(indicator && btn) {
            indicator.style.width = btn.offsetWidth + 'px';
            indicator.style.left = btn.offsetLeft + 'px';
        }
    }

    async function handleRefresh() {
        const btn = document.getElementById('refresh-btn');
        const dot = document.getElementById('status-dot');
        const body = document.getElementById('app-body');
        
        if(btn.classList.contains('spinning')) return;
        
        btn.classList.add('spinning');
        dot.classList.add('loading');
        body.classList.add('is-loading');
        
        await loadData();
        
        setTimeout(() => { 
            btn.classList.remove('spinning'); 
            dot.classList.remove('loading');
            body.classList.remove('is-loading'); 
        }, 1200);
    }

    async function tryFetch(url) {
        for (let proxy of PROXIES) {
            try {
                const res = await fetch(proxy + encodeURIComponent(url));
                const text = await res.text();
                if (res.ok && text.length > 50) return text;
            } catch (e) {}
        }
        return "";
    }

    async function loadData() {
        const csv = await tryFetch(SHEET_URL);
        if(!csv) return;
        const rows = parseCSV(csv);
        const head = rows[0].map(x => x.toLowerCase().trim());
        const m = {
            n: head.findIndex(x => x.includes('wertpapier')),
            i: head.findIndex(x => x.includes('isin')),
            d: head.findIndex(x => x.includes('depot')),
            s: head.findIndex(x => x.includes('stück')),
            ew: head.findIndex(x => x.includes('einstandswert')),
            kw: head.findIndex(x => x.includes('kurswert')),
            kat: head.findIndex(x => x.includes('kategorie'))
        };

        allData = [];
        const depots = new Set();
        for (let i = 1; i < rows.length; i++) {
            const r = rows[i]; if (!r[m.n]) continue;
            const item = { name: r[m.n], isin: r[m.i], depot: r[m.d] || '?', stück: parseMenge(r[m.s]), kurswert: parseMenge(r[m.kw]), einstand: parseMenge(r[m.ew]), kategorie: r[m.kat] || 'Aktie' };
            item.diff = item.kurswert - item.einstand;
            item.diffP = item.einstand ? (item.diff / item.einstand) * 100 : 0;
            allData.push(item); depots.add(item.depot);
        }
        
        const now = new Date();
        const timeString = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('update-time').innerText = `Aktualisiert: ${now.toLocaleDateString('de-DE')} • ${timeString} Uhr`;
        
        updateFilters(depots);
        render();

        setTimeout(() => {
            const activeSortBtn = document.querySelector('.sort-bar-container .filter-btn.active');
            if (activeSortBtn) moveSortIndicator(activeSortBtn);
        }, 100);
    }

    function updateFilters(set) {
        const container = document.getElementById('filter-inner');
        const list = ['alle', ...Array.from(set).sort()];
        container.innerHTML = list.map(d => `<button class="filter-btn ${d === currentFilter ? 'active' : ''}" onclick="setFilter(this, '${d}')">${d}</button>`).join('');
        const activeBtn = Array.from(container.querySelectorAll('#filter-inner .filter-btn')).find(b => b.innerText === currentFilter);
        if(activeBtn) moveIndicator(activeBtn);
    }

    function setFilter(btn, value) {
        currentFilter = value;
        document.querySelectorAll('#filter-inner .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        moveIndicator(btn);
        document.getElementById('total-label').innerText = (value === 'alle') ? 'Gesamtwert' : `Depot ${value}`;
        render();
    }

    function moveIndicator(btn) {
        const indicator = document.getElementById('nav-indicator');
        if (indicator && btn) {
            indicator.style.width = btn.offsetWidth + 'px';
            indicator.style.left = btn.offsetLeft + 'px';
        }
    }

    function render() {
        let filtered = currentFilter === 'alle' ? allData : allData.filter(d => d.depot === currentFilter);
        
        let portfolioData = [...filtered];
        portfolioData.sort((a, b) => {
            let res = 0;
            if (currentSort === 'name') res = a.name.localeCompare(b.name);
            else if (currentSort === 'value') res = a.kurswert - b.kurswert;
            else if (currentSort === 'gain') res = a.diffP - b.diffP;
            return sortAsc ? res : -res;
        });

        let tW = 0, tE = 0, html = '', etfSum = 0, aktieSum = 0;
        let countries = {};

        portfolioData.forEach(item => {
            tW += item.kurswert; tE += item.einstand;
            
            if(item.kategorie.toLowerCase().includes('etf')) {
                etfSum += item.kurswert;
            } else {
                aktieSum += item.kurswert;
                const cCode = item.isin?.substring(0, 2).toUpperCase() || '🌍';
                countries[cCode] = (countries[cCode] || 0) + item.kurswert;
            }

            const isP = item.diff >= 0;
            html += `<div class="asset-card"><div style="display:flex; justify-content:space-between; align-items:center;"><div><div class="asset-name">${item.name}</div><div class="asset-meta"><span>${item.isin}</span><div class="flag-circle">${getFlag(item.isin, item.kategorie)}</div></div><div class="asset-amount">${formatStueck(item.stück)} Stück</div></div><div style="text-align:right;"><div class="value-eur ${isP?'text-green':'text-red'}">${fC(item.kurswert)}</div><div style="font-size:0.95rem; font-weight:600" class="${isP?'text-green':'text-red'}">${isP?'+':''}${item.diffP.toFixed(2)}%</div></div></div></div>`;
        });
        document.getElementById('list').innerHTML = html;
        const diff = tW - tE, perc = tE ? (diff / tE) * 100 : 0;
        
        document.getElementById('main-value').innerText = fC(tW);
        document.getElementById('main-change').innerText = `${diff >= 0 ? '+' : ''}${fC(diff)} (${perc.toFixed(2)}%)`;
        document.getElementById('main-change').className = `total-change ${diff >= 0 ? 'positive' : 'negative'}`;

        renderAnalyse(aktieSum, etfSum, tW, countries);

        if (window.twemoji) twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
    }

    function renderAnalyse(aktien, etfs, gesamt, countries) {
        const pAktie = gesamt ? (aktien / gesamt * 100) : 0;
        const pEtf = gesamt ? (etfs / gesamt * 100) : 0;
        
        const chart = document.getElementById('allocation-chart');
        chart.style.background = `conic-gradient(var(--color-aktie) 0% ${pAktie}%, var(--color-etf) ${pAktie}% 100%)`;
        
        document.getElementById('allocation-legend').innerHTML = `
            <div class="legend-item">
                <div class="dot" style="background: var(--color-aktie)"></div>
                <div class="legend-info">
                    <span class="legend-name">Aktien</span>
                    <span class="legend-value">${fC(aktien)}</span>
                    <span class="legend-perc">${pAktie.toFixed(1)}%</span>
                </div>
            </div>
            <div class="legend-item">
                <div class="dot" style="background: var(--color-etf)"></div>
                <div class="legend-info">
                    <span class="legend-name">ETFs</span>
                    <span class="legend-value">${fC(etfs)}</span>
                    <span class="legend-perc">${pEtf.toFixed(1)}%</span>
                </div>
            </div>
        `;

        const sortedCountries = Object.entries(countries).sort((a, b) => b[1] - a[1]);
        document.getElementById('country-legend').innerHTML = sortedCountries.map(([code, val]) => {
            const p = gesamt ? (val / gesamt * 100) : 0;
            const formattedVal = fC(val).split(',')[0] + ' €'; 
            return `
                <div class="legend-item">
                    <div class="flag-box">${countryToFlag[code] || '🌍'}</div>
                    <div class="legend-info">
                        <span class="legend-name">${code}</span>
                        <span class="legend-value">${formattedVal}</span>
                        <span class="legend-perc">${p.toFixed(1)}%</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function fC(v) { return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(v); }
    function parseMenge(t) { return parseFloat((t||"0").toString().replace(/[€$£\s]/g, '').replace(/\./g, '').replace(',', '.')) || 0; }
    function getFlag(isin, kat) { return (kat||"").toLowerCase().includes('etf') ? '🌍' : (countryToFlag[isin?.substring(0, 2).toUpperCase()] || '🌍'); }
    function formatStueck(n) { return Number.isInteger(n) ? n.toString() : n.toFixed(2).replace('.', ','); }
    function parseCSV(t) {
        const rows = []; let cur = [], v = '', q = false;
        for (let i = 0; i < t.length; i++) {
            const c = t[i];
            if (c === '"') q = !q;
            else if (c === ',' && !q) { cur.push(v.trim()); v = ''; }
            else if ((c === '\n' || c === '\r') && !q) { cur.push(v.trim()); rows.push(cur); cur = []; v = ''; if(c==='\r'&&t[i+1]==='\n')i++; }
            else v += c;
        }
        if (v || cur.length) { cur.push(v.trim()); rows.push(cur); }
        return rows;
    }

    setupFooterAnimation();
    handleRefresh();
</script>
</body>
</html>
